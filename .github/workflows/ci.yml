name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript type check
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t agent-mesh:test .
      - name: Check image size
        run: |
          SIZE=$(docker images agent-mesh:test --format "{{.Size}}")
          echo "Image size: $SIZE"

  required-checks:
    runs-on: ubuntu-latest
    needs: [build, code-quality, test, docker-build]
    if: always()
    steps:
      - name: Check all required jobs
        if: needs.build.result != 'success' || needs.code-quality.result != 'success' || needs.test.result != 'success' || needs.docker-build.result != 'success'
        run: exit 1
