name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Build and push Docker image
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }} .
          docker push ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
          docker tag ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Generate changelog
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: context.ref
            });

            const changes = commits.commits.map(c => `- ${c.commit.message.split('\n')[0]}`).join('\n');
            return `## Changes\n${changes}`;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## agent-mesh ${{ steps.get_version.outputs.VERSION }}

            ${{ steps.changelog.outputs.result }}

            ### Docker
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
            ```
          draft: false
          prerelease: false
